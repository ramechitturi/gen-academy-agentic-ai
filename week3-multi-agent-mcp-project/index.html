<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Analysis Approval System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            color-scheme: light;
        }

        .container {
            display: flex;
            width: 100%;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Main chat area */
        .chat-section {
            flex: 1;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            min-height: 600px;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
        }

        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 90%;
            word-wrap: break-word;
        }

        .message.system {
            background: #f3f4f6;
            color: #374151;
            align-self: flex-start;
        }

        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
        }

        .analysis-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            margin: 10px 0;
            align-self: flex-start;
            width: 100%;
        }

        .analysis-card h3 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .analysis-field {
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .analysis-field strong {
            color: #374151;
            display: inline-block;
            min-width: 140px;
        }

        .decision-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .decision-badge.approve {
            background: #d1fae5;
            color: #065f46;
        }

        .decision-badge.review {
            background: #fef3c7;
            color: #92400e;
        }

        .policy-list {
            background: #f0f9ff;
            border-left: 3px solid #0ea5e9;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            font-size: 12px;
        }

        .policy-list strong {
            color: #0369a1;
        }

        /* Input area */
        .chat-footer {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-analyze {
            background: #667eea;
            color: white;
        }

        .btn-analyze:hover {
            background: #5568d3;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-approve {
            background: #10b981;
            color: white;
            flex: 0.5;
        }

        .btn-approve:hover {
            background: #059669;
        }

        .btn-reject {
            background: #ef4444;
            color: white;
            flex: 0.5;
        }

        .btn-reject:hover {
            background: #dc2626;
        }

        .btn-approve:disabled,
        .btn-reject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .decision-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-left: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* History sidebar */
        .history-section {
            width: 300px;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-height: 600px;
        }

        .history-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 600;
            color: #374151;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #f9fafb;
        }

        .history-ticker {
            font-weight: 600;
            color: #667eea;
        }

        .history-time {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .history-decision {
            font-size: 11px;
            margin-top: 4px;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-pending {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-approved {
            background: #d1fae5;
            color: #065f46;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }

            .history-section {
                width: 100%;
                max-height: 300px;
            }
        }

        .error-message {
            color: #dc2626;
            padding: 10px;
            background: #fee2e2;
            border-radius: 6px;
            margin: 10px 0;
        }

        .success-message {
            color: #065f46;
            padding: 10px;
            background: #d1fae5;
            border-radius: 6px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Chat Section -->
        <div class="chat-section">
            <div class="chat-header">
                <h1>📈 Stock Analysis Assistant</h1>
            </div>

            <div class="chat-body" id="chatBody">
                <div class="message system">
                    Welcome! Enter a stock ticker (e.g., AAPL) to analyze. I'll fetch live data, analyze sentiment, check compliance policies, and ask for your approval.
                </div>
            </div>

            <div class="chat-footer">
                <div class="input-group">
                    <input
                        type="text"
                        id="tickerInput"
                        placeholder="Enter stock ticker (e.g., AAPL, MSFT, BADNEWS for demo)..."
                        autocomplete="off"
                    />
                    <button class="btn-analyze" onclick="analyzeStock()">Analyze</button>
                </div>
            </div>
        </div>

        <!-- History Sidebar -->
        <div class="history-section">
            <div class="history-header">📋 Decision History</div>
            <div class="history-list" id="historyList">
                <div style="padding: 10px; color: #9ca3af; font-size: 13px;">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000/api";
        let currentAnalysisId = null;

        async function analyzeStock() {
            const ticker = document.getElementById("tickerInput").value.trim();

            if (!ticker) {
                showMessage("system", "Please enter a ticker symbol.");
                return;
            }

            showMessage("user", `Analyzing ${ticker}...`);
            addLoadingMessage();

            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ticker }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || "Analysis failed");
                }

                const analysis = await response.json();
                currentAnalysisId = analysis.analysis_id;

                // Remove loading message
                document.querySelector(".loading").parentElement.remove();

                // Display analysis
                displayAnalysis(analysis);
                loadHistory();
                document.getElementById("tickerInput").value = "";

            } catch (error) {
                document.querySelector(".loading").parentElement.remove();
                showMessage("system", `❌ Error: ${error.message}`);
            }
        }

        function displayAnalysis(analysis) {
            const card = document.createElement("div");
            card.className = "analysis-card";
            card.innerHTML = `
                <h3>Analysis for ${analysis.ticker}</h3>

                <div class="analysis-field">
                    <strong>Price:</strong> $${analysis.price ? analysis.price.toFixed(2) : "N/A"}
                </div>

                <div class="analysis-field">
                    <strong>Summary:</strong> ${escapeHtml(analysis.analyst_summary)}
                </div>

                <div class="analysis-field">
                    <strong>Compliance:</strong>
                    <p>${escapeHtml(analysis.compliance_notes)}</p>
                </div>

                ${analysis.retrieved_docs.length > 0 ? `
                    <div class="policy-list">
                        <strong>Retrieved Policies:</strong>
                        <ul style="margin-left: 15px; margin-top: 5px;">
                            ${analysis.retrieved_docs
                                .map(doc => `<li>${escapeHtml(doc.source)}</li>`)
                                .join("")}
                        </ul>
                    </div>
                ` : ""}

                <div class="analysis-field">
                    <strong>LLM Recommendation:</strong>
                    <span class="decision-badge ${analysis.llm_decision}">
                        ${analysis.llm_decision.toUpperCase()}
                    </span>
                    <p style="margin-top: 5px; color: #6b7280;">
                        Reason: ${escapeHtml(analysis.reason)}
                    </p>
                </div>

                <div class="decision-buttons">
                    <button class="btn-approve" onclick="submitDecision('approve', ${analysis.analysis_id})">
                        ✓ Approve
                    </button>
                    <button class="btn-reject" onclick="submitDecision('reject', ${analysis.analysis_id})">
                        ✗ Reject
                    </button>
                </div>
            `;

            document.getElementById("chatBody").appendChild(card);
            document.getElementById("chatBody").scrollTop = document.getElementById("chatBody").scrollHeight;
        }

        async function submitDecision(decision, analysisId) {
            try {
                const response = await fetch(`${API_BASE}/decision`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        analysis_id: analysisId,
                        user_decision: decision,
                    }),
                });

                if (!response.ok) throw new Error("Decision submission failed");

                const result = await response.json();
                showMessage(
                    "system",
                    `✓ Decision recorded: ${decision.toUpperCase()}`
                );

                // Disable buttons for this analysis
                const buttons = document.querySelectorAll(".decision-buttons button");
                buttons.forEach(btn => btn.disabled = true);

                loadHistory();

            } catch (error) {
                showMessage("system", `❌ Error: ${error.message}`);
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/decisions`);
                if (!response.ok) throw new Error("Failed to load history");

                const decisions = await response.json();
                const historyList = document.getElementById("historyList");

                if (decisions.length === 0) {
                    historyList.innerHTML = '<div style="padding: 10px; color: #9ca3af;">No decisions yet</div>';
                    return;
                }

                historyList.innerHTML = decisions
                    .map(d => {
                        const date = new Date(d.created_at);
                        const timeStr = date.toLocaleTimeString();
                        const status = d.user_decision === "pending" ? "pending" :
                                     d.user_decision === "approve" ? "approved" : "rejected";

                        return `
                            <div class="history-item" onclick="loadAnalysis(${d.id})">
                                <div class="history-ticker">${d.ticker}</div>
                                <div class="history-time">${timeStr}</div>
                                <div class="history-decision">
                                    LLM: <span class="decision-badge ${d.llm_decision}">${d.llm_decision}</span>
                                    <br>
                                    You: <span class="status-badge status-${status}">${status}</span>
                                </div>
                            </div>
                        `;
                    })
                    .join("");

            } catch (error) {
                console.error("Error loading history:", error);
            }
        }

        async function loadAnalysis(analysisId) {
            try {
                const response = await fetch(`${API_BASE}/analysis/${analysisId}`);
                if (!response.ok) throw new Error("Failed to load analysis");

                const analysis = await response.json();
                currentAnalysisId = analysis.analysis_id;

                // Clear chat and show analysis
                document.getElementById("chatBody").innerHTML = "";
                showMessage("system", `Loaded previous analysis for ${analysis.ticker}`);
                displayAnalysis(analysis);

            } catch (error) {
                showMessage("system", `❌ Error: ${error.message}`);
            }
        }

        function showMessage(type, text) {
            const msg = document.createElement("div");
            msg.className = `message ${type}`;
            msg.textContent = text;
            document.getElementById("chatBody").appendChild(msg);
            document.getElementById("chatBody").scrollTop = document.getElementById("chatBody").scrollHeight;
        }

        function addLoadingMessage() {
            const msg = document.createElement("div");
            msg.className = "message system";
            msg.innerHTML = 'Analyzing<span class="loading"></span>';
            document.getElementById("chatBody").appendChild(msg);
            document.getElementById("chatBody").scrollTop = document.getElementById("chatBody").scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Load history on startup
        loadHistory();

        // Allow Enter key to submit
        document.getElementById("tickerInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") analyzeStock();
        });
    </script>
</body>
</html>
